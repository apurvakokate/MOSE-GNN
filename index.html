    const experiments = [...new Set(rawData.map(d => d.experiment))];
    const datasets = [...new Set(rawData.map(d => d.dataset))];
    const architectures = ["GCN", "GAT", "SAGE", "GIN"];

    // Populate experiment dropdown
    const expSelect = document.getElementById('experiment');
    experiments.forEach(exp => {
        const opt = document.createElement('option');
        opt.value = exp;
        opt.textContent = exp;
        expSelect.appendChild(opt);
    });

    // Create dataset checkboxes
    const dsDiv = document.getElementById('datasetCheckboxes');
    datasets.forEach(ds => {
        const label = document.createElement('label');
        label.style.marginRight = '10px';
        const cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.value = ds;
        cb.checked = true;
        label.appendChild(cb);
        label.appendChild(document.createTextNode(ds));
        dsDiv.appendChild(label);
    });

    function getSelectedDatasets() {
        return [...document.querySelectorAll('#datasetCheckboxes input:checked')].map(cb => cb.value);
    }

    function updatePlot() {
        const selectedExp = document.getElementById('experiment').value;
        const selectedRank = document.getElementById('rankType').value;
        const sortMetric = document.getElementById('sortMetric').value;
        const selectedDatasets = getSelectedDatasets();

        const filtered = rawData.filter(d => 
            d.experiment === selectedExp &&
            d.rank_type === selectedRank &&
            selectedDatasets.includes(d.dataset)
        );

        const figData = [];
        architectures.forEach((arch, idx) => {
            const archData = filtered.filter(d => d.architecture === arch);
            const grouped = {}
            archData.forEach(d => {
                if (!grouped[d.dataset]) grouped[d.dataset] = [];
                grouped[d.dataset].push(d);
            });

            Object.keys(grouped).forEach(ds => {
                const sorted = grouped[ds].sort((a,b) => b[sortMetric] - a[sortMetric]);
                figData.push({
                    x: sorted.map(s => s[sortMetric]),
                    y: sorted.map(s => s.motif),
                    type: 'bar',
                    orientation: 'h',
                    name: ds,
                    marker: {color: datasetColors[ds]},
                    xaxis: 'x' + (idx+1),
                    yaxis: 'y' + (idx+1)
                });
            });
        });

        const layout = {
            grid: {rows: 1, columns: 4, pattern: 'independent'},
            barmode: 'stack',
            title: `Motifs for ${selectedExp} | ${selectedRank} | ${sortMetric}`,
            height: 1000,
            annotations: [
                {text: 'GCN', font: {size: 16}, showarrow: false, x: 0.125, xref: 'paper', y: 1.05, yref: 'paper'},
                {text: 'GAT', font: {size: 16}, showarrow: false, x: 0.375, xref: 'paper', y: 1.05, yref: 'paper'},
                {text: 'SAGE', font: {size: 16}, showarrow: false, x: 0.625, xref: 'paper', y: 1.05, yref: 'paper'},
                {text: 'GIN', font: {size: 16}, showarrow: false, x: 0.875, xref: 'paper', y: 1.05, yref: 'paper'}
            ]
        };

        Plotly.newPlot('plot', figData, layout);
    }

    document.getElementById('experiment').addEventListener('change', updatePlot);
    document.getElementById('rankType').addEventListener('change', updatePlot);
    document.getElementById('sortMetric').addEventListener('change', updatePlot);
    document.querySelectorAll('#datasetCheckboxes input').forEach(cb => cb.addEventListener('change', updatePlot));

    updatePlot();
</script>
